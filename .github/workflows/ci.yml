name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests, lint and detekt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # O build lê o commit com `git rev-parse` (BuildConfig.GIT_SHA, mostrado na tela
      # Sobre); o checkout padrão já basta para isso.
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # A v3 pedia o pacote "tools", que o sdkmanager atual não tem mais, e falhava.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36

      - uses: gradle/actions/setup-gradle@v6

      # local.properties não é versionado; no runner o SDK vem de ANDROID_HOME.
      - name: Build and check
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
