name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests, lint and detekt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # O build lê o commit com `git rev-parse` (BuildConfig.GIT_SHA, mostrado na tela
      # Sobre); o checkout padrão já basta para isso.
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      # local.properties não é versionado; no runner o SDK vem de ANDROID_HOME.
      - name: Build and check
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
